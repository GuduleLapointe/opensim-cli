# The command line to set up and manage OpenSimulator, built by dev/build.sh (or apt-package) from build/opensim-cli,
# prepared by packaging/build. ${VERSION} comes from build-tools.
# The files in /usr/share/opensim-cli, the command opensim in /usr/bin; the projects of the family it needs are their own
# packages (bash-tools, opensim-engine, opensim-rest-php), linked into its vendor folder.
name: opensim-cli
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: utils
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
  Command line to set up and manage OpenSimulator
  The opensim command: setup of a grid, a standalone or a simulator, status,
  start, stop, restart, console and the installation of the .NET runtime.
  The rules and the work are the engine's.
homepage: https://github.com/GuduleLapointe/opensim-cli
license: AGPL-3.0-or-later

depends:
  - bash
  - bash-tools
  - dialog
  - jq
  - opensim-engine
  - opensim-rest-php
  - php-cli (>= 2:8.2)

contents:
  - src: build/opensim-cli
    dst: /usr/share/opensim-cli
    type: tree
  - src: /usr/share/bash-tools
    dst: /usr/share/opensim-cli/vendor/magicoli/bash-tools
    type: symlink
  - src: /usr/share/opensim-engine
    dst: /usr/share/opensim-cli/vendor/magicoli/opensim-engine
    type: symlink
  - src: /usr/share/opensim-rest-php
    dst: /usr/share/opensim-cli/vendor/magicoli/opensim-rest-php
    type: symlink
  - src: /usr/share/opensim-cli/bin/opensim
    dst: /usr/bin/opensim
    type: symlink
  - src: share/bash-completion/opensim
    dst: /usr/share/bash-completion/completions/opensim
